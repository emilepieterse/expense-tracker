<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple browser-based expense tracker with add, edit, delete, and category breakdown.">
  <title>Expense Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="summary">
      <div class="summary-box">
        <span class="label">Total Spent</span>
        <span id="totalAmount" class="amount">$0.00</span>
      </div>
    </div>

    <form id="expenseForm">
      <input type="text" id="description" placeholder="Description" required>
      <input type="number" id="amount" placeholder="Amount" step="0.01" min="0.01" required>
      <select id="category" required>
        <option value="" disabled selected>Category</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Housing">Housing</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Health">Health</option>
        <option value="Other">Other</option>
      </select>
      <input type="date" id="date" required>
      <button type="submit" id="submitBtn">Add Expense</button>
      <button type="button" id="cancelBtn" class="hidden">Cancel</button>
    </form>

    <div class="categories" id="categoryBreakdown"></div>

    <div class="list-header">
      <h2>Expenses</h2>
      <select id="filterCategory">
        <option value="">All Categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Housing">Housing</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Health">Health</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <ul id="expenseList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
